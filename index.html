<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESC 2026 - TOTAL SYNC JURY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { 
            background: #050505; 
            background: radial-gradient(circle at top right, #1e1b4b, #050505);
            color: white; 
            min-height: 100vh; 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden;
        }
        .glass { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.08); 
            border-radius: 32px; 
        }
        .accent-indigo { color: #818cf8; }
        input[type="range"] { -webkit-appearance: none; background: rgba(255,255,255,0.1); height: 8px; border-radius: 10px; accent-color: #6366f1; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: #6366f1; border-radius: 50%; cursor: pointer; border: 3px solid #050505; }
        .debug-panel { font-family: 'Courier New', monospace; font-size: 9px; line-height: 1.2; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- TOP STATUS BAR -->
    <div class="max-w-md mx-auto mb-6 flex justify-between items-center bg-black/40 p-4 rounded-2xl border border-white/5">
        <div class="flex items-center gap-3">
            <div id="status-dot" class="h-2.5 w-2.5 rounded-full bg-red-500 shadow-[0_0_10px_red] animate-pulse"></div>
            <div class="flex flex-col">
                <span id="status-text" class="text-[10px] font-black uppercase tracking-widest opacity-40">Offline</span>
                <span id="peer-count" class="text-[9px] font-bold accent-indigo">Nodes: 0</span>
            </div>
        </div>
        <div class="text-right">
            <div id="room-display" class="text-[10px] font-black italic opacity-60">ROOM: LOADING...</div>
            <button onclick="clearData()" class="text-[8px] uppercase tracking-tighter opacity-20 hover:opacity-100">Reset Session</button>
        </div>
    </div>

    <!-- LOGIN SECTION -->
    <div id="setup" class="max-w-md mx-auto glass p-10 text-center mt-10 shadow-2xl">
        <div class="text-5xl mb-6">🎙️</div>
        <h1 class="text-3xl font-black mb-2 italic">EURO<span class="accent-indigo">VISION</span></h1>
        <p class="text-[10px] opacity-40 uppercase tracking-[0.4em] mb-10">Jury Portal 2026</p>
        
        <input id="userName" type="text" placeholder="Enter Your Name" 
               class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl mb-4 text-center text-xl focus:outline-none focus:border-indigo-500 transition-all">
        
        <button onclick="startApp()" class="w-full bg-indigo-600 hover:bg-indigo-500 p-5 rounded-2xl font-black text-sm uppercase tracking-widest transition-all shadow-xl shadow-indigo-500/20">
            Enter Live Room
        </button>
    </div>

    <!-- MAIN VOTING APP -->
    <div id="main-app" class="hidden max-w-md mx-auto space-y-4">
        
        <div class="glass p-8 text-center relative overflow-hidden">
            <div id="current-avg" class="absolute top-4 right-4 bg-indigo-500/10 text-indigo-400 text-[10px] font-bold px-2 py-1 rounded border border-indigo-500/20">
                AVG: --
            </div>
            
            <img id="flag" src="" class="h-12 mx-auto mb-4 rounded shadow-2xl transition-all duration-700">
            <h2 id="country" class="text-4xl font-black mb-1 tracking-tight">Country</h2>
            <p id="artist" class="text-sm opacity-40 italic mb-8">Artist Name</p>
            
            <div class="bg-black/30 p-8 rounded-[32px] border border-white/5 shadow-inner">
                <input type="range" id="rng" min="1" max="12" step="1" value="1" class="w-full mb-6">
                <div class="flex justify-between items-end">
                    <span class="text-[10px] font-black opacity-20 tracking-[0.2em]">POINTS</span>
                    <span id="cur-val" class="text-7xl font-black italic accent-indigo leading-none">1</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-8">
                <button onclick="move(-1)" class="bg-white/5 hover:bg-white/10 p-5 rounded-2xl text-[10px] font-black tracking-widest opacity-60 transition-all">PREV</button>
                <button onclick="move(1)" class="bg-indigo-600 hover:bg-indigo-500 p-5 rounded-2xl text-[10px] font-black tracking-widest transition-all">NEXT</button>
            </div>
        </div>

        <!-- LIVE JURY FEED -->
        <div class="glass p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-[10px] font-black opacity-30 uppercase tracking-[0.2em]">Consensus Stream</h3>
                <span id="voter-count" class="text-[10px] font-mono opacity-30">0 Members</span>
            </div>
            <div id="jury-list" class="space-y-2"></div>
        </div>

        <button onclick="toggleLeaderboard()" class="w-full py-4 text-[10px] font-black opacity-30 uppercase tracking-[0.4em] hover:opacity-100 transition-opacity">
            Final Standings
        </button>
    </div>

    <!-- LEADERBOARD MODAL -->
    <div id="leaderboard" class="hidden fixed inset-0 z-50 bg-black/95 backdrop-blur-2xl p-8 overflow-y-auto">
        <div class="max-w-md mx-auto">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-3xl font-black italic">STANDINGS</h2>
                <button onclick="toggleLeaderboard()" class="h-12 w-12 flex items-center justify-center rounded-full bg-white/5 text-2xl font-light">×</button>
            </div>
            <div id="standings-list" class="space-y-3"></div>
        </div>
    </div>

    <!-- DIAGNOSTICS -->
    <div class="max-w-md mx-auto mt-12 p-4 border-t border-white/5 opacity-20">
        <p class="text-[9px] font-black uppercase mb-2">Network Diagnostics</p>
        <div id="debug-log" class="debug-panel space-y-1 h-20 overflow-hidden">
            Initializing sync engine...
        </div>
    </div>

<script>
// --- CONFIGURATION ---
const songs = [
    {c:"Denmark", code:"dk", a:"Søren Torpegaard Lund"},
    {c:"Germany", code:"de", a:"Sarah Engels"},
    {c:"Israel", code:"il", a:"Noam Bettan"},
    {c:"Belgium", code:"be", a:"ESSYLA"},
    {c:"Austria", code:"at", a:"COSMÓ"},
    {c:"Sweden", code:"se", a:"TBD"},
    {c:"United Kingdom", code:"gb", a:"TBD"}
];

let idx = 0;
let myName = localStorage.getItem('esc_2026_user') || "";
let roomCache = {}; // Global store for all votes
const ROOM_ID = 'ESC2026_V10_' + (window.location.hash.substring(1) || 'GLOBAL');

// --- GUN INITIALIZATION ---
// Using 4 different reliable relay providers to ensure PC/Mobile handshake
const gun = Gun({
    peers: [
        'https://gun-manhattan.herokuapp.com/gun',
        'https://relay.peer.ooo/gun',
        'https://gunjs.herokuapp.com/gun',
        'https://gun-ams1.marda.io/gun'
    ],
    localStorage: true
});

// --- UI SETUP ---
if(myName) document.getElementById('userName').value = myName;
document.getElementById('room-display').innerText = "ROOM: " + ROOM_ID.split('_').pop();

function dbg(msg) {
    const log = document.getElementById('debug-log');
    const time = new Date().toLocaleTimeString().split(' ')[0];
    log.innerHTML = `<div>[${time}] ${msg}</div>` + log.innerHTML;
}

// --- CONNECTION HANDLERS ---
gun.on('hi', (peer) => {
    document.getElementById('status-dot').className = "h-2.5 w-2.5 rounded-full bg-green-400 shadow-[0_0_10px_#4ade80]";
    document.getElementById('status-text').innerText = "Live Consensus";
    updatePeerDisplay();
    dbg("Node Connected: " + peer.url);
});

function updatePeerDisplay() {
    const count = Object.keys(gun._.opt.peers).length;
    document.getElementById('peer-count').innerText = "Nodes: " + count;
}

// --- APP LOGIC ---
function startApp() {
    myName = document.getElementById('userName').value.trim();
    if(!myName) return alert("Enter your jury name!");
    localStorage.setItem('esc_2026_user', myName);
    
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('main-app').classList.remove('hidden');
    
    initSync();
    render();
}

function initSync() {
    dbg("Starting Global Room Watcher...");
    
    // One persistent listener for the entire room
    gun.get(ROOM_ID).map().on((countryData, countryName) => {
        if(!countryData || countryName === '_') return;

        // Watch every user score for every country
        gun.get(ROOM_ID).get(countryName).map().on((score, user) => {
            if(!user || user === '_' || typeof score === 'object') return;
            
            // Update the global cache
            if(!roomCache[countryName]) roomCache[countryName] = {};
            roomCache[countryName][user] = parseFloat(score);
            
            // If the user updated the song we are currently looking at, refresh UI
            if(countryName === songs[idx].c) {
                updateJuryFeed();
            }
            dbg(`Update: ${user} scored ${countryName}`);
        });
    });
}

function render() {
    const s = songs[idx];
    document.getElementById('country').innerText = s.c;
    document.getElementById('artist').innerText = s.a;
    document.getElementById('flag').src = `https://flagcdn.com/w160/${s.code}.png`;
    
    // Get my saved score for this song from memory
    const myLastScore = (roomCache[s.c] && roomCache[s.c][myName]) ? roomCache[s.c][myName] : 1;
    document.getElementById('rng').value = myLastScore;
    document.getElementById('cur-val').innerText = myLastScore;

    updateJuryFeed();
}

function updateJuryFeed() {
    const container = document.getElementById('jury-list');
    const votes = roomCache[songs[idx].c] || {};
    container.innerHTML = '';
    
    let total = 0, count = 0;
    
    Object.entries(votes).forEach(([name, val]) => {
        const div = document.createElement('div');
        div.className = "flex justify-between items-center bg-white/5 p-4 rounded-2xl border border-white/5 animate-pulse";
        div.innerHTML = `<span class="text-xs font-bold opacity-40">${name}</span>
                         <span class="font-black accent-indigo italic text-lg">${val}</span>`;
        container.appendChild(div);
        total += val;
        count++;
    });

    document.getElementById('voter-count').innerText = `${count} Juries`;
    document.getElementById('current-avg').innerText = count > 0 ? `AVG: ${(total/count).toFixed(1)}` : 'AVG: --';
}

// --- USER ACTIONS ---
document.getElementById('rng').oninput = function() {
    const val = this.value;
    document.getElementById('cur-val').innerText = val;
    
    // PUSH DATA: Room -> Country -> MyName -> Score
    gun.get(ROOM_ID).get(songs[idx].c).get(myName).put(val);
};

function move(dir) {
    const target = idx + dir;
    if(target >= 0 && target < songs.length) {
        idx = target;
        render();
    }
}

function toggleLeaderboard() {
    const modal = document.getElementById('leaderboard');
    if(modal.classList.contains('hidden')) {
        calculateLeaderboard();
        modal.classList.remove('hidden');
    } else {
        modal.classList.add('hidden');
    }
}

function calculateLeaderboard() {
    const list = document.getElementById('standings-list');
    const results = [];

    songs.forEach(s => {
        const votes = roomCache[s.c] || {};
        const vals = Object.values(votes);
        if(vals.length > 0) {
            const avg = vals.reduce((a,b) => a+b, 0) / vals.length;
            results.push({ name: s.c, avg: avg, code: s.code });
        }
    });

    results.sort((a,b) => b.avg - a.avg);

    list.innerHTML = results.map((r, i) => `
        <div class="flex justify-between items-center bg-white/5 p-6 rounded-3xl border border-white/10">
            <div class="flex items-center gap-5">
                <span class="text-2xl font-black opacity-10">#${i+1}</span>
                <img src="https://flagcdn.com/w40/${r.code}.png" class="h-4 rounded-sm shadow-lg">
                <span class="font-black tracking-tight text-xl">${r.name}</span>
            </div>
            <span class="text-3xl font-black accent-indigo italic">${r.avg.toFixed(2)}</span>
        </div>
    `).join('') || '<p class="text-center opacity-30 py-20 uppercase font-black tracking-widest text-xs">No votes cast yet</p>';
}

function clearData() {
    if(confirm("Wipe all local data and restart?")) {
        localStorage.clear();
        location.reload();
    }
}

// --- HEARTBEAT ---
// Keeps the mobile browser socket from closing during long performances
setInterval(() => {
    if(myName) {
        gun.get(ROOM_ID).get('_pulse').put(Date.now());
        updatePeerDisplay();
    }
}, 5000);
</script>
</body>
</html>
