<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESC 2026 - HARD SYNC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <style>
        body { background: #020205; color: #e2e8f0; font-family: sans-serif; min-height: 100vh; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 2rem; }
        .status-active { background: #10b981; box-shadow: 0 0 15px #10b981; }
        input[type="range"] { accent-color: #6366f1; }
    </style>
</head>
<body class="p-6">

    <!-- CONNECTION DIAGNOSTICS -->
    <div class="max-w-md mx-auto mb-6 glass p-4 flex justify-between items-center text-[10px] font-bold tracking-widest uppercase">
        <div class="flex items-center gap-2">
            <div id="dot" class="h-2 w-2 rounded-full bg-red-600 transition-all duration-500"></div>
            <span id="stat">Connecting...</span>
        </div>
        <div id="peer-id" class="opacity-30">Nodes: 0</div>
    </div>

    <!-- LOGIN -->
    <div id="login" class="max-w-md mx-auto glass p-10 text-center mt-12 shadow-2xl">
        <h1 class="text-4xl font-black italic mb-2">ESC <span class="text-indigo-500">2026</span></h1>
        <p class="text-[10px] opacity-40 mb-10 tracking-[0.3em]">Jury Synchronization Engine</p>
        <input id="u" type="text" placeholder="Your Name" class="w-full bg-black/50 border border-white/10 p-4 rounded-xl mb-4 text-center focus:border-indigo-500 outline-none">
        <button onclick="entry()" class="w-full bg-indigo-600 p-4 rounded-xl font-bold hover:bg-indigo-500 transition-all">Start Voting</button>
    </div>

    <!-- APP -->
    <div id="app" class="hidden max-w-md mx-auto space-y-4">
        <div class="glass p-8 text-center">
            <div id="avg" class="text-[10px] font-mono text-indigo-400 mb-2">AVERAGE: --</div>
            <img id="flag" src="" class="h-10 mx-auto mb-2 rounded shadow-lg">
            <h2 id="cntry" class="text-3xl font-black mb-6">Country</h2>
            
            <div class="bg-black/40 p-6 rounded-3xl border border-white/5 mb-6">
                <div id="val" class="text-6xl font-black italic text-indigo-500 mb-2">1</div>
                <input type="range" id="rng" min="1" max="12" step="1" value="1" class="w-full h-2">
            </div>

            <div class="flex gap-2">
                <button onclick="step(-1)" class="flex-1 bg-white/5 p-4 rounded-xl font-bold text-xs">PREV</button>
                <button onclick="step(1)" class="flex-1 bg-indigo-600 p-4 rounded-xl font-bold text-xs">NEXT</button>
            </div>
        </div>

        <!-- LIVE LIST -->
        <div class="glass p-6">
            <div class="flex justify-between items-center mb-4 opacity-40 text-[10px] font-black uppercase">
                <span>Jury Stream</span>
                <span id="count">0 Votes</span>
            </div>
            <div id="list" class="space-y-2 text-sm font-bold"></div>
        </div>
    </div>

<script>
const songs = [
    {c:"Denmark", code:"dk", a:"Søren Torpegaard Lund"},
    {c:"Germany", code:"de", a:"Sarah Engels"},
    {c:"Israel", code:"il", a:"Noam Bettan"},
    {c:"Belgium", code:"be", a:"ESSYLA"},
    {c:"Austria", code:"at", a:"COSMÓ"}
];

let i = 0, name = "", db = {};
const ROOM = "ESC2026_FINAL_TEST_ROOM"; // Ensure this is exactly the same on all devices

// Use a specific European relay + the main Manhattan relay
const gun = Gun({
    peers: [
        'https://gun-manhattan.herokuapp.com/gun',
        'https://relay.peer.ooo/gun',
        'https://gunjs.herokuapp.com/gun'
    ]
});

gun.on('hi', p => {
    document.getElementById('dot').classList.add('status-active');
    document.getElementById('stat').innerText = "Live Mesh Connected";
    document.getElementById('peer-id').innerText = "Nodes: " + Object.keys(gun._.opt.peers).length;
});

function entry() {
    name = document.getElementById('u').value.trim();
    if(!name) return;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    
    // START GLOBAL LISTENER
    // We listen to the ROOM node. Every update to any country comes through here.
    gun.get(ROOM).map().on((data, key) => {
        if(!data || key === '_') return;
        
        // Data format: ROOM -> "CountryName-UserName" -> Score
        // This flat structure is much faster for Gun to sync than nested objects
        const [cName, uName] = key.split('::');
        if(!db[cName]) db[cName] = {};
        db[cName][uName] = data;
        
        if(cName === songs[i].c) draw();
    });
    
    render();
}

function render() {
    const s = songs[i];
    document.getElementById('cntry').innerText = s.c;
    document.getElementById('flag').src = `https://flagcdn.com/w160/${s.code}.png`;
    
    // Check if I already voted for this
    const myLast = (db[s.c] && db[s.c][name]) ? db[s.c][name] : 1;
    document.getElementById('rng').value = myLast;
    document.getElementById('val').innerText = myLast;
    
    draw();
}

function draw() {
    const votes = db[songs[i].c] || {};
    const container = document.getElementById('list');
    container.innerHTML = '';
    
    let sum = 0, n = 0;
    Object.entries(votes).forEach(([user, score]) => {
        const row = document.createElement('div');
        row.className = "flex justify-between bg-white/5 p-3 rounded-xl border border-white/5";
        row.innerHTML = `<span class="opacity-50">${user}</span><span class="text-indigo-400">${score}</span>`;
        container.appendChild(row);
        sum += parseInt(score);
        n++;
    });
    
    document.getElementById('count').innerText = n + " Votes";
    document.getElementById('avg').innerText = n > 0 ? "AVERAGE: " + (sum/n).toFixed(1) : "AVERAGE: --";
}

document.getElementById('rng').oninput = function() {
    const score = this.value;
    document.getElementById('val').innerText = score;
    // PUSH FLAT KEY: CountryName::UserName
    const key = songs[i].c + "::" + name;
    gun.get(ROOM).get(key).put(score);
};

function step(d) {
    let next = i + d;
    if(next >= 0 && next < songs.length) {
        i = next;
        render();
    }
}
</script>
</body>
</html>
