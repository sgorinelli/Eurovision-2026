<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESC 2026 - JURY LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        body { background: #050510; color: white; font-family: sans-serif; min-height: 100vh; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; }
        .accent { color: #818cf8; }
    </style>
</head>
<body class="p-4 md:p-10 flex flex-col items-center">

    <!-- CONNECTION STATUS -->
    <div class="w-full max-w-md glass p-4 mb-6 flex justify-between items-center text-[10px] font-black uppercase tracking-widest">
        <div class="flex items-center gap-2">
            <div id="dot" class="h-2 w-2 rounded-full bg-red-600 transition-all duration-300"></div>
            <span id="stat">Disconnected</span>
        </div>
        <div id="room-id" class="opacity-40">ROOM: LOADING...</div>
    </div>

    <!-- LOGIN -->
    <div id="setup" class="w-full max-w-md glass p-10 text-center shadow-2xl">
        <h1 class="text-3xl font-black italic mb-2 tracking-tighter uppercase">Eurovision <span class="accent">2026</span></h1>
        <p class="text-[10px] opacity-40 mb-10 tracking-[0.4em]">MQTT REAL-TIME JURY</p>
        <input id="uName" type="text" placeholder="Your Name" class="w-full bg-black/50 border border-white/10 p-4 rounded-xl mb-4 text-center focus:border-indigo-500 outline-none">
        <button onclick="connect()" class="w-full bg-indigo-600 p-4 rounded-xl font-black uppercase tracking-widest hover:bg-indigo-500 transition-all">Join Session</button>
    </div>

    <!-- APP -->
    <div id="app" class="hidden w-full max-w-md space-y-4">
        <div class="glass p-8 text-center relative">
            <div id="avg" class="absolute top-4 right-4 bg-indigo-500/20 text-indigo-400 text-[10px] px-2 py-1 rounded font-mono font-bold">AVG: --</div>
            <img id="flag" src="" class="h-10 mx-auto mb-4 rounded shadow-lg">
            <h2 id="country" class="text-3xl font-black mb-6 uppercase italic tracking-tighter">Country</h2>
            
            <div class="bg-black/40 p-8 rounded-3xl border border-white/5 mb-6">
                <div id="cur-val" class="text-7xl font-black italic accent leading-none mb-2">1</div>
                <input type="range" id="rng" min="1" max="12" step="1" value="1" class="w-full h-1.5 accent-indigo-500">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="nav(-1)" class="bg-white/5 p-4 rounded-xl font-bold text-[10px] uppercase tracking-widest">Back</button>
                <button onclick="nav(1)" class="bg-indigo-600 p-4 rounded-xl font-bold text-[10px] uppercase tracking-widest">Next</button>
            </div>
        </div>

        <!-- JURY LIST -->
        <div class="glass p-6">
            <h3 class="text-[10px] font-black opacity-30 uppercase mb-4 tracking-[0.2em]">Real-Time Jury Consensus</h3>
            <div id="jury-list" class="space-y-2"></div>
        </div>
    </div>

<script>
const songs = [
    {c:"Denmark", code:"dk"}, {c:"Germany", code:"de"}, {c:"Israel", code:"il"},
    {c:"Belgium", code:"be"}, {c:"Austria", code:"at"}
];

let idx = 0, myName = "", client = null;
let roomData = {}; // Format: { "Denmark": { "User1": 10, "User2": 8 } }

// Unique Room ID based on URL hash or a default
const ROOM = "ESC2026_" + (window.location.hash.substring(1) || "GENERAL_V1");
document.getElementById('room-id').innerText = "ROOM: " + ROOM;

// 1. MQTT CONNECTION
function connect() {
    myName = document.getElementById('uName').value.trim();
    if(!myName) return alert("Enter your name!");

    // Using the public HiveMQ Broker over Secure WebSockets
    client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

    client.on('connect', () => {
        document.getElementById('dot').className = "h-2 w-2 rounded-full bg-green-500 shadow-[0_0_10px_#4ade80]";
        document.getElementById('stat').innerText = "Connected";
        
        // Subscribe to the room
        client.subscribe(`vienna2026/jury/${ROOM}/#`);
        
        // Let others know you joined and request their current scores
        broadcast({ type: "HELLO", user: myName });

        document.getElementById('setup').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        render();
    });

    client.on('message', (topic, message) => {
        const data = JSON.parse(message.toString());
        
        if (data.type === "SCORE") {
            handleScoreUpdate(data);
        } else if (data.type === "HELLO" && data.user !== myName) {
            // When someone new joins, send them your current score for the song you're on
            sendMyCurrentScore();
        }
    });
}

function broadcast(obj) {
    if(client) client.publish(`vienna2026/jury/${ROOM}/events`, JSON.stringify(obj));
}

function sendMyCurrentScore() {
    const val = document.getElementById('rng').value;
    broadcast({ type: "SCORE", user: myName, country: songs[idx].c, score: val });
}

function handleScoreUpdate(data) {
    if(!roomData[data.country]) roomData[data.country] = {};
    roomData[data.country][data.user] = data.score;
    
    if(data.country === songs[idx].c) refreshUI();
}

// 2. UI LOGIC
function render() {
    const s = songs[idx];
    document.getElementById('country').innerText = s.c;
    document.getElementById('flag').src = `https://flagcdn.com/w160/${s.code}.png`;
    
    // Set slider to my local memory of this song
    const myLast = (roomData[s.c] && roomCache(s.c)[myName]) ? roomData[s.c][myName] : 1;
    document.getElementById('rng').value = myLast;
    document.getElementById('cur-val').innerText = myLast;
    
    refreshUI();
}

function refreshUI() {
    const list = document.getElementById('jury-list');
    const votes = roomData[songs[idx].c] || {};
    list.innerHTML = '';
    
    let sum = 0, n = 0;
    Object.entries(votes).forEach(([user, score]) => {
        const row = document.createElement('div');
        row.className = "flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/5";
        row.innerHTML = `<span class="text-xs font-bold ${user === myName ? 'accent' : 'opacity-40'}">${user}</span>
                         <span class="font-black accent italic">${score}</span>`;
        list.appendChild(row);
        sum += parseInt(score);
        n++;
    });

    document.getElementById('avg').innerText = n > 0 ? "AVG: " + (sum/n).toFixed(1) : "AVG: --";
}

// 3. INPUT
document.getElementById('rng').oninput = function() {
    const val = this.value;
    document.getElementById('cur-val').innerText = val;
    
    // Update local memory
    if(!roomData[songs[idx].c]) roomData[songs[idx].c] = {};
    roomData[songs[idx].c][myName] = val;
    
    // Broadcast to the broker
    broadcast({ type: "SCORE", user: myName, country: songs[idx].c, score: val });
};

function nav(dir) {
    let next = idx + dir;
    if(next >= 0 && next < songs.length) {
        idx = next;
        render();
    }
}
</script>
</body>
</html>
