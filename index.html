<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESC 2026 - ULTIMATE SYNC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <style>
        body { background: #0b0a1a; background: radial-gradient(circle at top, #1e1b4b 0%, #0b0a1a 100%); color: white; min-height: 100vh; font-family: 'Inter', system-ui, sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); border-radius: 28px; }
        input[type="range"] { -webkit-appearance: none; background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; background: #6366f1; border-radius: 50%; cursor: pointer; border: 3px solid #0b0a1a; box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }
        .tab-active { border-bottom: 2px solid #6366f1; color: #6366f1; }
    </style>
</head>
<body class="p-4 flex flex-col items-center">

    <!-- CONNECTION & ROOM HEADER -->
    <div class="w-full max-w-md flex justify-between items-center mb-6 px-2">
        <div class="flex items-center gap-3">
            <div id="dot" class="h-2 w-2 rounded-full bg-red-500 shadow-[0_0_8px_red] animate-pulse"></div>
            <div class="flex flex-col">
                <span id="status-text" class="text-[9px] uppercase font-black tracking-widest opacity-40">Connecting...</span>
                <span id="peer-count" class="text-[8px] font-mono opacity-30 leading-none">PEERS: 0</span>
            </div>
        </div>
        <div class="text-right">
            <div id="room-id-display" class="text-[10px] font-black text-indigo-400 uppercase tracking-tighter italic">ROOM: ---</div>
            <button onclick="localStorage.clear(); location.reload();" class="text-[8px] opacity-20 hover:opacity-100 uppercase">Reset Cache</button>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="setup" class="w-full max-w-md glass p-10 text-center mt-8">
        <h1 class="text-3xl font-black mb-2 tracking-tighter italic">ESC <span class="text-indigo-500">2026</span></h1>
        <p class="text-xs opacity-40 mb-8">Decentralized Jury Portal • Vienna</p>
        <input id="userName" type="text" placeholder="Enter Jury Name" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 text-center focus:outline-none focus:border-indigo-500">
        <button onclick="start()" class="w-full bg-indigo-600 hover:bg-indigo-500 p-4 rounded-2xl font-bold transition-all shadow-xl shadow-indigo-600/20">Join Live Session</button>
    </div>

    <!-- MAIN APP -->
    <div id="app" class="hidden w-full max-w-md space-y-4">
        
        <!-- SONG CARD -->
        <div class="glass p-8 text-center relative overflow-hidden">
            <div id="live-avg" class="absolute top-4 right-4 bg-white/5 px-2 py-1 rounded text-[10px] font-mono text-indigo-300 border border-white/10">AVG: 0.0</div>
            
            <img id="flag" src="" class="h-12 mx-auto mb-4 rounded-md shadow-2xl">
            <h2 id="country-name" class="text-4xl font-black mb-1">---</h2>
            <p id="artist-name" class="text-sm opacity-40 italic mb-8 uppercase tracking-widest">---</p>
            
            <div class="bg-black/20 p-8 rounded-[32px] border border-white/5 shadow-inner">
                <input type="range" id="score-slider" min="1" max="12" step="1" value="1" class="w-full mb-6">
                <div class="flex justify-between items-end">
                    <span class="text-[10px] font-black opacity-20 tracking-widest">JURY VOTE</span>
                    <span id="score-display" class="text-7xl font-black italic leading-none text-indigo-500">1</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mt-6">
                <button onclick="changeSong(-1)" class="bg-white/5 hover:bg-white/10 p-4 rounded-2xl text-[10px] font-black opacity-60">PREVIOUS</button>
                <button onclick="changeSong(1)" class="bg-indigo-600 hover:bg-indigo-500 p-4 rounded-2xl text-[10px] font-black">NEXT SONG</button>
            </div>
        </div>

        <!-- JURY FEED -->
        <div class="glass p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-[10px] font-black opacity-30 uppercase tracking-[0.2em]">Live Consensus</h3>
                <span id="active-voters" class="text-[10px] font-mono opacity-30 italic">0 votes</span>
            </div>
            <div id="jury-list" class="space-y-2">
                <!-- Live data here -->
            </div>
        </div>

        <button onclick="toggleView()" class="w-full py-4 text-[10px] font-black opacity-30 uppercase tracking-[0.3em] hover:opacity-100 transition-opacity">Toggle Leaderboard</button>
    </div>

    <!-- LEADERBOARD OVERLAY -->
    <div id="leaderboard" class="hidden fixed inset-0 z-50 bg-[#0b0a1a]/95 backdrop-blur-xl p-8 overflow-y-auto">
        <div class="max-w-md mx-auto">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-3xl font-black italic">STANDINGS</h2>
                <button onclick="toggleView()" class="h-10 w-10 flex items-center justify-center rounded-full bg-white/5 text-xl font-light">×</button>
            </div>
            <div id="standings-list" class="space-y-3"></div>
        </div>
    </div>

<script>
const songs = [
    {c:"Denmark", code:"dk", a:"Søren Torpegaard Lund"},
    {c:"Germany", code:"de", a:"Sarah Engels"},
    {c:"Israel", code:"il", a:"Noam Bettan"},
    {c:"Belgium", code:"be", a:"ESSYLA"},
    {c:"Austria", code:"at", a:"COSMÓ"},
    {c:"Sweden", code:"se", a:"TBD Artist"},
    {c:"UK", code:"gb", a:"TBD Artist"}
];

let idx = 0;
let uName = localStorage.getItem('esc_jury_2026_name') || "";
let roomData = {}; // Global state for ALL songs in the room
const ROOM_ID = 'ESC2026_v1_' + (window.location.hash.substring(1) || 'VIENNA_MAIN');

// Initialize GUN with high-availability peers
const gun = Gun({
    peers: [
        'https://gun-manhattan.herokuapp.com/gun',
        'https://gunjs.herokuapp.com/gun',
        'https://relay.peer.ooo/gun',
        'https://gun-ams1.marda.io/gun' // European Relay
    ],
    localStorage: true 
});

// Setup
if(uName) document.getElementById('userName').value = uName;
document.getElementById('room-id-display').innerText = `ROOM: ${ROOM_ID.split('_').pop()}`;

// Global Network Monitoring
gun.on('hi', (peer) => {
    document.getElementById('dot').className = 'h-2 w-2 rounded-full bg-green-400 shadow-[0_0_8px_#4ade80]';
    document.getElementById('status-text').innerText = 'System Live';
    updatePeerCount();
});

function updatePeerCount() {
    const peers = Object.keys(gun._.opt.peers).length;
    document.getElementById('peer-count').innerText = `NODES: ${peers}`;
}

function start() {
    uName = document.getElementById('userName').value.trim();
    if(!uName) return alert("Identify yourself!");
    localStorage.setItem('esc_jury_2026_name', uName);
    
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    
    // START GLOBAL OBSERVER (Listen to EVERYTHING in the room once)
    initGlobalSync();
    renderSong();
}

function initGlobalSync() {
    // We listen to the entire ROOM node. When anything changes in any country, 
    // it updates our local 'roomData' object.
    gun.get(ROOM_ID).map().on((countryObj, countryName) => {
        if(!countryObj || countryName === '_') return;
        
        // Listen to each user within that country
        gun.get(ROOM_ID).get(countryName).map().on((score, userName) => {
            if(!userName || userName === '_' || typeof score === 'object') return;
            
            if(!roomData[countryName]) roomData[countryName] = {};
            roomData[countryName][userName] = parseFloat(score);
            
            // Only trigger UI update if it's the song we are looking at
            if(countryName === songs[idx].c) {
                updateJuryUI();
            }
        });
    });
}

function renderSong() {
    const s = songs[idx];
    document.getElementById('country-name').innerText = s.c;
    document.getElementById('artist-name').innerText = s.a;
    document.getElementById('flag').src = `https://flagcdn.com/w160/${s.code}.png`;
    
    // Set my local slider to what I previously voted, or default 1
    const myVote = (roomData[s.c] && roomData[s.c][uName]) ? roomData[s.c][uName] : 1;
    document.getElementById('score-slider').value = myVote;
    document.getElementById('score-display').innerText = myVote;

    updateJuryUI();
}

function updateJuryUI() {
    const list = document.getElementById('jury-list');
    list.innerHTML = '';
    const currentVotes = roomData[songs[idx].c] || {};
    
    let total = 0, count = 0;

    Object.entries(currentVotes).forEach(([name, val]) => {
        const div = document.createElement('div');
        div.className = "flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/5 animate-in fade-in zoom-in duration-300";
        div.innerHTML = `<span class="text-xs font-bold opacity-60">${name}</span>
                         <span class="font-black text-indigo-400 italic">${val}</span>`;
        list.appendChild(div);
        total += val;
        count++;
    });

    document.getElementById('active-voters').innerText = `${count} ${count === 1 ? 'vote' : 'votes'}`;
    document.getElementById('live-avg').innerText = count > 0 ? `AVG: ${(total/count).toFixed(1)}` : 'AVG: 0.0';
}

// Input Handling
document.getElementById('score-slider').oninput = function() {
    const val = this.value;
    document.getElementById('score-display').innerText = val;
    // Push to Gun
    gun.get(ROOM_ID).get(songs[idx].c).get(uName).put(val);
};

function changeSong(dir) {
    const newIdx = idx + dir;
    if(newIdx >= 0 && newIdx < songs.length) {
        idx = newIdx;
        renderSong();
    }
}

function toggleView() {
    const lb = document.getElementById('leaderboard');
    if(lb.classList.contains('hidden')) {
        updateLeaderboard();
        lb.classList.remove('hidden');
    } else {
        lb.classList.add('hidden');
    }
}

function updateLeaderboard() {
    const container = document.getElementById('standings-list');
    const board = [];

    songs.forEach(s => {
        const votes = roomData[s.c] || {};
        const vals = Object.values(votes);
        if(vals.length > 0) {
            const avg = vals.reduce((a,b) => a+b, 0) / vals.length;
            board.push({ name: s.c, score: avg, flag: s.code });
        }
    });

    board.sort((a,b) => b.score - a.score);

    container.innerHTML = board.map((item, i) => `
        <div class="flex justify-between items-center bg-white/5 p-5 rounded-3xl border border-white/10">
            <div class="flex items-center gap-4">
                <span class="text-2xl font-black opacity-10">#${i+1}</span>
                <img src="https://flagcdn.com/w40/${item.flag}.png" class="h-4 rounded-sm">
                <span class="font-bold tracking-tight text-lg">${item.name}</span>
            </div>
            <span class="text-2xl font-black text-indigo-500 italic">${item.score.toFixed(2)}</span>
        </div>
    `).join('') || '<p class="text-center opacity-30 mt-10">No scores recorded yet.</p>';
}
</script>
</body>
</html>
